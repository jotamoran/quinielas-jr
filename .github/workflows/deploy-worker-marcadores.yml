name: Desplegar Worker de marcadores

on:
  push:
    branches:
      - main
    paths:
      - 'workers/marcadores/**'
      - '.github/workflows/deploy-worker-marcadores.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-marcadores
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/marcadores/wrangler.jsonc
